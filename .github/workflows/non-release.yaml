name: Build
on:
  push:
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      mode: snapshot
    permissions:
      contents: read
      id-token: write

  component-descriptor:
    uses: gardener/cc-utils/.github/workflows/post-build.yaml@d478850afa1a7e0f9deb710e4d44eb0a2d8dce07 # 1.2881.0
    needs:
      - build
    permissions:
      id-token: write
      contents: write
